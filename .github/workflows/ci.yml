name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: ./scripts/quality.sh
      - run: uv run pytest tests/ -q
      # The package tests import `from conftest import ...`, which names one module
      # per session, so each package runs in its own pytest session.
      - name: Package tests
        run: |
          status=0
          for dir in packages/*/; do
            if [ ! -d "${dir}tests" ]; then
              echo "::error::${dir} has no tests directory"
              status=1
              continue
            fi
            uv run pytest "${dir}tests" -q || status=1
          done
          exit "$status"

  # Each adapter reads the package values, the binding rules and the condition evaluator
  # from the `asago-package` member, and none of them may name the authoring application.
  # The isolated environment installs only the adapter, the Asago members it declares and
  # pytest, so an import of the authoring application fails and names the leak.
  adapter-isolation:
    name: ${{ matrix.adapter }} without the authoring application
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: asago-bundle-core
            module: asago_bundle_core
            libraries: --with ./packages/asago-package
          - adapter: asago-bundle-garak
            module: asago_bundle_garak
            libraries: >-
              --with ./packages/asago-package
              --with ./packages/asago-bundle-core
              --with ./packages/asago-bundle-midojo
          - adapter: asago-bundle-midojo
            module: asago_bundle_midojo
            libraries: --with ./packages/asago-package --with ./packages/asago-bundle-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: The adapter imports in its isolated environment
        run: |
          uv run --isolated --no-project \
            --with ./packages/${{ matrix.adapter }} ${{ matrix.libraries }} \
            python -c "import ${{ matrix.module }}"
      - name: The authoring application does not
        run: |
          if uv run --isolated --no-project \
            --with ./packages/${{ matrix.adapter }} ${{ matrix.libraries }} \
            python -c "import asago_artifact_generator"; then
            echo "::error::the ${{ matrix.adapter }} environment imports the authoring application"
            exit 1
          fi
      - name: Tests
        run: |
          uv run --isolated --no-project \
            --with ./packages/${{ matrix.adapter }} ${{ matrix.libraries }} \
            --with pytest \
            pytest packages/${{ matrix.adapter }}/tests -q
