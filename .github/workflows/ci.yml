name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Both checkouts live under repos/ so the producer sits beside the consumer at
    # the paths its lock and members resolve the sibling from.
    defaults:
      run:
        working-directory: repos/asago-artifact-generator
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/asago-artifact-generator
      # The lock resolves asago-handoff and the producer app from
      # ../asago-scenario-generator, so the producer fork is checked out as the
      # consumer's sibling. Both forks are public, so the default GITHUB_TOKEN
      # suffices.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hjrnunes/asago-scenario-generator
          ref: main
          path: repos/asago-scenario-generator
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # The producer-pair group installs the producer app from the sibling checkout
      # above, so the writer-to-reader pair test runs in CI instead of skipping.
      - run: uv sync --locked --group producer-pair
      - run: ./scripts/quality.sh
      # The root session runs the copy checks: the mirrors of the producer's kits, the
      # built-wheel install and the MiDojo lock.
      - run: uv run pytest tests/ -q
      # The package tests import `from conftest import ...`, which names one module
      # per session, so each package runs in its own pytest session.
      - name: Package tests
        run: |
          status=0
          for dir in packages/*/; do
            if [ ! -d "${dir}tests" ]; then
              echo "::error::${dir} has no tests directory"
              status=1
              continue
            fi
            uv run pytest "${dir}tests" -q || status=1
          done
          exit "$status"

  # Each adapter and the injection-spec library read the package values, the binding rules
  # and the condition evaluator from the `asago-package` member, and none of them may name
  # the authoring application. The isolated environment installs only the member, the Asago
  # members it declares and pytest, so an import of the authoring application fails and
  # names the leak. `bundle-garak` declares the injection-spec library, not the MiDojo
  # adapter, and reads it through that dependency.
  adapter-isolation:
    name: ${{ matrix.adapter }} without the authoring application (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repos/asago-artifact-generator
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        # The adapter is a matrix axis, not only an include value: an include-only
        # adapter list merges into the same two combinations and the last entry wins,
        # so only one adapter runs per Python. Each include entry augments the
        # combinations that already name its adapter.
        adapter:
          - asago-bundle-core
          - asago-bundle-garak
          - asago-injection-spec
        include:
          - adapter: asago-bundle-core
            module: asago_bundle_core
            libraries: --with ./packages/asago-package
          - adapter: asago-bundle-garak
            module: asago_bundle_garak
            libraries: >-
              --with ./packages/asago-package
              --with ./packages/asago-bundle-core
              --with ./packages/asago-injection-spec
          - adapter: asago-injection-spec
            module: asago_injection_spec
            libraries: --with ./packages/asago-package --with ./packages/asago-bundle-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/asago-artifact-generator
      # The members resolve asago-handoff through the workspace's path source, which
      # names ../asago-scenario-generator/packages/asago-handoff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hjrnunes/asago-scenario-generator
          ref: main
          path: repos/asago-scenario-generator
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: The member imports in its isolated environment
        run: |
          uv run --isolated --no-project \
            --with ./packages/${{ matrix.adapter }} ${{ matrix.libraries }} \
            python -c "import ${{ matrix.module }}"
      - name: The authoring application does not
        run: |
          if uv run --isolated --no-project \
            --with ./packages/${{ matrix.adapter }} ${{ matrix.libraries }} \
            python -c "import asago_artifact_generator"; then
            echo "::error::the ${{ matrix.adapter }} environment imports the authoring application"
            exit 1
          fi
      - name: Tests
        run: |
          uv run --isolated --no-project \
            --with ./packages/${{ matrix.adapter }} ${{ matrix.libraries }} \
            --with pytest \
            pytest packages/${{ matrix.adapter }}/tests -q ${{ matrix.pytest_args }}
