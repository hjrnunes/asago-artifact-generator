name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: ./scripts/quality.sh
      - run: uv run pytest tests/ -q
      # The package tests import `from conftest import ...`, which names one module
      # per session, so each package runs in its own pytest session.
      - name: Package tests
        run: |
          status=0
          for dir in packages/*/; do
            if [ ! -d "${dir}tests" ]; then
              echo "::error::${dir} has no tests directory"
              status=1
              continue
            fi
            uv run pytest "${dir}tests" -q || status=1
          done
          exit "$status"
