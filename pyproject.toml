[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asago-artifact-generator"
version = "0.1.0"
description = "Policy-driven agentic red-teaming artifact generator for LLM evaluation platforms"
requires-python = ">=3.12"
dependencies = [
    "asago-contracts-core>=0.1,<0.2",
    "asago-handoff>=0.1,<0.2",
    "asago-package>=0.1,<0.2",
    "asago-report-kit>=0.1,<0.2",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "openai>=1.0",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
asago-artifact-generator = "asago_artifact_generator.cli:app"

[dependency-groups]
dev = [
    "asago-bundle-core",
    "asago-bundle-garak",
    "asago-injection-spec>=0.1,<0.2",
    "pytest>=8.0",
    "ruff>=0.6",
]
# The writer-to-reader pair test (tests/test_handoff_writer_reader_pair.py) drives
# the producer's real handoff writer in process, so it needs the producer sibling
# checkout as an editable path source (``asago-scenario-generator`` below). The
# default dev group stays installable in a consumer-only checkout or CI without
# the sibling; sync this group only where the sibling exists:
# ``uv sync --locked --group producer-pair``.
# The producer imports ``httpx`` without declaring it and gets it only through ``openai``
# before version 3, so the group names it.
producer-pair = [
    "asago-scenario-generator",
    "httpx>=0.27",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# The producer-owned contracts core: the shared handoff validator, canonical JSON and
# conformance runner. Declared by name above; the path stays here. The producer
# packages below are the runtime dependencies the lock always resolves; the
# producer app itself sits in the ``producer-pair`` group.
asago-contracts-core = { path = "../asago-scenario-generator/packages/asago-contracts-core", editable = true }
# The producer-owned handoff contract: one validator and one condition-v2 evaluator
# shared by the producer, this repository and the orchestrator.
asago-handoff = { path = "../asago-scenario-generator/packages/asago-handoff", editable = true }
asago-bundle-core = { workspace = true }
asago-bundle-garak = { workspace = true }
asago-injection-spec = { workspace = true }
asago-package = { workspace = true }
# Local milestone pin: re-point this source to the fork SHA before release.
midojo-spec = { git = "file:///Users/hjrnunes/workspace/asago/midojo", subdirectory = "packages/midojo-spec", rev = "32e3b541244459626582ca00f31ac91ec29e06d2" }
# The producer-owned report kit: the components every HTML report renders with. Declared by
# name above; the path stays here.
asago-report-kit = { path = "../asago-scenario-generator/packages/asago-report-kit", editable = true }
# The producer app: the writer-to-reader pair test's in-process writer. Named by
# the ``producer-pair`` dependency group only, so the default dev group never
# needs this checkout.
asago-scenario-generator = { path = "../asago-scenario-generator", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/asago_artifact_generator"]

# contracts/ stays at the repository root, where the orchestrator checks its mirrors byte
# for byte; the wheel carries a copy that contract_kit.contract_dir finds after
# installation. The package library moves its three kits as package data of its own member.
[tool.hatch.build.targets.wheel.force-include]
"contracts" = "asago_artifact_generator/contracts"

[tool.ruff]
target-version = "py312"
line-length = 99
src = [
    "src",
    "tests",
    "scripts",
    "packages/asago-bundle-core/src",
    "packages/asago-bundle-garak/src",
    "packages/asago-injection-spec/src",
    "packages/asago-package/src",
]
# MiDojo's fixture copies are byte for byte MiDojo's: its lock pins each sha256, and MiDojo
# styles its own ``generate.py`` at its line length, so neither lint nor format reads them.
extend-exclude = ["packages/asago-injection-spec/tests/fixtures/midojo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The replay gate is development tooling in scripts/, outside the package.
pythonpath = ["scripts"]
norecursedirs = [
    ".*",
    "build",
    "dist",
    "node_modules",
    "venv",
    "__pycache__",
    "runs",
]
