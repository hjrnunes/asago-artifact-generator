[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asago-artifact-generator"
version = "0.1.0"
description = "Policy-driven agentic red-teaming artifact generator for LLM evaluation platforms"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
asago-artifact-generator = "asago_artifact_generator.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["src/asago_artifact_generator"]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".*",
    "build",
    "dist",
    "node_modules",
    "venv",
    "__pycache__",
    "runs",
    "examples",
]
