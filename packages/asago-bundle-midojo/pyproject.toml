[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asago-bundle-midojo"
version = "0.1.0"
description = "MiDojo adapter: compiles a planted_item artifact package into a response-injection MiDojo episode for a target and parses its sealed snapshot and verdict into an execution receipt"
requires-python = ">=3.12"
dependencies = [
    "asago-bundle-core",
    # The injection-spec compiler, the envelope and the sealed-result reader, which Garak
    # reads too.
    "asago-injection-spec>=0.1,<0.2",
    "asago-package>=0.1,<0.2",
    # The judge service and the CLI; the SDK carries no part of the harness.
    "midojo-sdk",
]

[project.scripts]
asago-bundle-midojo = "asago_bundle_midojo.cli:main"

[tool.uv.sources]
asago-bundle-core = { workspace = true }
asago-injection-spec = { workspace = true }
asago-package = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/asago_bundle_midojo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
