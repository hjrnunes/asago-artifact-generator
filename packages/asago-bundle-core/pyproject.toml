[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asago-bundle-core"
version = "0.1.0"
description = "Shared core of the tool adapters: the tool-bundle-v1 schema, slot markers, capability-gap record, error base class and adapter conformance helper"
requires-python = ">=3.11"
dependencies = [
    "asago-artifact-generator",
    "jsonschema>=4.0",
]

[tool.uv.sources]
asago-artifact-generator = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/asago_bundle_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
