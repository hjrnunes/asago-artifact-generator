[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asago-bundle-garak"
version = "0.1.0"
description = "Garak adapter: compiles an artifact package into a Garak bundle and parses Garak's report into an execution receipt"
requires-python = ">=3.12"
dependencies = [
    "asago-bundle-core",
    # ``report_parse`` names the core's envelope error, so the adapter declares the
    # core directly instead of reading it through ``bundle-core``'s resolution.
    "asago-contracts-core>=0.1,<0.2",
    "asago-injection-spec>=0.1,<0.2",
    "asago-package>=0.1,<0.2",
    "midojo-spec>=0.1,<0.2",
]

[project.scripts]
asago-bundle-garak = "asago_bundle_garak.cli:main"

[tool.uv.sources]
asago-bundle-core = { workspace = true }
asago-injection-spec = { workspace = true }
asago-package = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/asago_bundle_garak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
