[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asago-bundle-garak"
version = "0.1.0"
description = "Garak adapter: compiles an artifact package into a Garak bundle and parses Garak's report into an execution receipt"
requires-python = ">=3.12"
dependencies = [
    "asago-bundle-core",
    # ``report_parse`` names the core's envelope error, so the adapter declares the
    # core directly instead of reading it through ``bundle-core``'s resolution.
    "asago-contracts-core>=0.1,<0.2",
    "asago-injection-spec>=0.1,<0.2",
    "asago-package>=0.1,<0.2",
]

[project.scripts]
asago-bundle-garak = "asago_bundle_garak.cli:main"

[dependency-groups]
# The parity test reads each sealed fixture case through ``bundle-midojo parse`` as well.
# Neither the library nor the CLI imports the MiDojo adapter, so it is a test-only dependency;
# the parity module skips where the adapter is absent, and the isolated CI run also deselects
# the marker (``-m "not parity"``) where it is installed.
parity = ["asago-bundle-midojo"]

[tool.uv.sources]
asago-bundle-core = { workspace = true }
asago-injection-spec = { workspace = true }
asago-package = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/asago_bundle_garak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "parity: reads each sealed case through bundle-garak and bundle-midojo; needs the test-only MiDojo adapter",
]
